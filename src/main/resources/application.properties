# ===================================================================
# Real Estate Management System - application.properties
# ===================================================================

# ---- Server ----
server.port=8080

# ---- H2 File-Based Database ----
# Using a FILE-based H2 database (not in-memory) so data survives app restarts.
# The database file(s) will be created at: ./data/realestatedb.mv.db
spring.datasource.url=jdbc:h2:file:./data/realestatedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- H2 Console (optional, handy for viewing DB in browser) ----
# Visit http://localhost:8080/h2-console after starting the app.
# JDBC URL to paste in the console: jdbc:h2:file:./data/realestatedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- SQL initialization ----
# Always run schema.sql then data.sql on startup.
# schema.sql uses "CREATE TABLE IF NOT EXISTS" and data.sql checks for existing
# rows, so re-running on every restart will NOT duplicate or wipe your data.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Since we are NOT using JPA/Hibernate, there is no entity auto-detection;
# this line just avoids a startup race between JdbcTemplate and sql.init.
spring.jpa.hibernate.ddl-auto=none

# ---- Jackson (JSON) ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Logging (optional, helpful while learning) ----
logging.level.org.springframework.jdbc.core=INFO
